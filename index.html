<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sol con Movimiento de Fuego</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #000000 50%, #050505 100%);
      overflow: hidden;
    }
    #solCanvas {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #playButton {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="solCanvas"></canvas>
  <div class="content text-white">
    <h1 class="text-3xl mb-16">texto</h1>
    <button
      id="playButton"
      class="w-40 h-40 rounded-full border-4 border-white flex items-center justify-center hover:scale-110 transition-transform"
    >
      <div
        class="w-0 h-0 border-t-[16px] border-t-transparent border-l-[28px] border-l-white border-b-[16px] border-b-transparent ml-2"
      ></div>
    </button>
  </div>

  <script>
    const canvas = document.getElementById("solCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let time = 0;

    function drawSun() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width * 0.25;
      const centerY = canvas.height * 0.5;
      const baseRadius = Math.min(canvas.width, canvas.height) * 0.2;

      // Pulsación (como latido)
      const pulse = 1 + 0.05 * Math.sin(time * 2);

      // Fondo brillante del sol
      const gradient = ctx.createRadialGradient(centerX, centerY, baseRadius * 0.1, centerX, centerY, baseRadius * 1.2);
      gradient.addColorStop(0, "rgba(255,255,100,1)");
      gradient.addColorStop(0.5, "rgba(255,180,0,0.9)");
      gradient.addColorStop(1, "rgba(255,80,0,0.1)");
      ctx.beginPath();
      ctx.arc(centerX, centerY, baseRadius * 1.2 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();

      // Fuego dinámico tipo aurora
      const points = 100;
      ctx.beginPath();
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2;
        const noise = Math.sin(angle * 6 + time * 2) * 0.15 + Math.sin(angle * 3 - time * 1.5) * 0.1;
        const radius = baseRadius * (0.9 + noise + 0.05 * Math.sin(time * 3));
        const x = centerX + Math.cos(angle) * radius * pulse;
        const y = centerY + Math.sin(angle) * radius * pulse;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      const fireGradient = ctx.createLinearGradient(centerX, centerY - baseRadius, centerX, centerY + baseRadius);
      fireGradient.addColorStop(0, "rgba(255,220,0,0.9)");
      fireGradient.addColorStop(0.5, "rgba(255,120,0,0.7)");
      fireGradient.addColorStop(1, "rgba(255,50,0,0.4)");

      ctx.fillStyle = fireGradient;
      ctx.shadowBlur = 40;
      ctx.shadowColor = "orange";
      ctx.fill();

      time += 0.02;
      requestAnimationFrame(drawSun);
    }

    drawSun();

    document.getElementById("playButton").addEventListener("click", () => {
      alert("Presionaste Play");
    });
  </script>
</body>
</html>
