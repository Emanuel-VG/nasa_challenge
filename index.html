<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sol Animado con Estrellas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    #solCanvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #playButton {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <canvas id="solCanvas"></canvas>

  <div class="content text-white">
    <h1 class="text-3xl mb-16">texto</h1>
    <button
      id="playButton"
      class="w-40 h-40 rounded-full border-4 border-white flex items-center justify-center hover:scale-110 transition-transform"
    >
      <div
        class="w-0 h-0 border-t-[16px] border-t-transparent border-l-[28px] border-l-white border-b-[16px] border-b-transparent ml-2"
      ></div>
    </button>
  </div>

  <script>
    const canvas = document.getElementById("solCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // 🌌 Generar estrellas
    const numStars = 120;
    const stars = Array.from({ length: numStars }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 1.8 + 0.5,
      speed: Math.random() * 0.3 + 0.05,
      alpha: Math.random() * 0.8 + 0.2,
      twinkle: Math.random() * Math.PI * 2
    }));

    let time = 0;

    function drawStars() {
      ctx.save();
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const s of stars) {
        s.twinkle += 0.02;
        const brightness = 0.5 + Math.sin(s.twinkle) * 0.5;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${s.alpha * brightness})`;
        ctx.fill();

        // Movimiento suave hacia la derecha
        s.x += s.speed;
        if (s.x > canvas.width + 5) s.x = -5;
      }
      ctx.restore();
    }

    // 🔥 Sol animado
    function drawSun() {
      const cx = canvas.width * 0.25; // Sol a la izquierda
      const cy = canvas.height * 0.5;
      const baseRadius = Math.min(canvas.width, canvas.height) * 0.2;

      const pulse = 1 + 0.03 * Math.sin(time * 2);

      // Fondo luminoso del sol
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseRadius * 2);
      glow.addColorStop(0, "rgba(255,200,0,0.4)");
      glow.addColorStop(1, "rgba(255,100,0,0)");
      ctx.beginPath();
      ctx.arc(cx, cy, baseRadius * 1.8, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();

      // Núcleo del sol
      const coreGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseRadius * 0.9);
      coreGradient.addColorStop(0, "#fff59d");
      coreGradient.addColorStop(0.4, "#ffe082");
      coreGradient.addColorStop(0.8, "#ffb300");
      coreGradient.addColorStop(1, "#f57c00");

      ctx.beginPath();
      ctx.arc(cx, cy, baseRadius * 0.7 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = coreGradient;
      ctx.fill();

      // Bordes flameantes con movimiento orgánico
      const points = 160;
      ctx.beginPath();
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2;
        const wave1 = Math.sin(angle * 9 + time * 2.5);
        const wave2 = Math.sin(angle * 6 - time * 1.8);
        const wave3 = Math.sin(angle * 4 + time);
        const variation = (wave1 * 0.07 + wave2 * 0.05 + wave3 * 0.03);
        const radius = baseRadius * (0.9 + variation);
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      const flameGradient = ctx.createLinearGradient(cx, cy - baseRadius, cx, cy + baseRadius);
      flameGradient.addColorStop(0, "rgba(255,230,0,0.95)");
      flameGradient.addColorStop(0.4, "rgba(255,150,0,0.9)");
      flameGradient.addColorStop(1, "rgba(255,60,0,0.7)");

      ctx.fillStyle = flameGradient;
      ctx.shadowBlur = 60;
      ctx.shadowColor = "orange";
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,180,0.5)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function animate() {
      drawStars();
      drawSun();
      time += 0.02;
      requestAnimationFrame(animate);
    }

    animate();

    document.getElementById("playButton").addEventListener("click", () => {
      alert("Presionaste Play");
    });
  </script>
</body>
</html>
